name: portfolio
description: "Asem El-Sayed Ammar — Senior Mobile Engineer Portfolio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.1.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Navigation
  go_router: ^17.5.0

  # HTTP & Networking (for future use)
  dio: ^5.11.0

  # Fonts
  google_fonts: ^8.2.1

  # Icons
  font_awesome_flutter: ^11.0.0

  # Animations
  animated_text_kit: ^4.3.0

  # Visibility / Scroll animations
  visibility_detector: ^0.4.0+2

  # URL Launcher (GitHub, LinkedIn, email)
  url_launcher: ^6.3.2

  # SVG support
  flutter_svg: ^2.3.0

  # Cupertino icons
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.3
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Gemini_Generated_Image_vzwhn2vzwhn2vzwh.png"
  web:
    generate: true
    image_path: "assets/images/Gemini_Generated_Image_vzwhn2vzwhn2vzwh.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
